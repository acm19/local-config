general.import = ["~/projects/_external/alacritty-theme/themes/catppuccin_macchiato.toml"]
general.live_config_reload = true

[bell]
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
blink_interval = 500
blink_timeout = 0

[cursor.style]
blinking = "Always"
shape = "Block"

[debug]
log_level = "Off"
persistent_logging = false
render_timer = false

[font]
size = 7.0

[font.bold]
family = "SFMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "SFMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "SFMono Nerd Font"
style = "Italic"

[font.normal]
family = "SFMono Nerd Font"
style = "Regular"

# fixes <C-^> alternative file in vim
[[keyboard.bindings]]
chars = "\u001E"
key = "Key6"
mods = "Control"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[scrolling]
# 0 disables scrolling
history = 0
multiplier = 5

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

# use tmux as shell
[terminal.shell]
args = ["new-session", "-A", "-D", "-s", "default"]
program = "tmux"

[window]
decorations = "full"
dynamic_padding = false
dynamic_title = true
opacity = 1.0
startup_mode = "Windowed"

[window.dimensions]
columns = 80
lines = 24

[window.padding]
x = 0
y = 0

# 1. Default URL handler (http, https, mailto, etc.)
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`]+"
command = "xdg-open"
binding = { key = "U", mods = "Control|Shift" }
mouse = { enabled = true, mods = "Shift" }

# 2. Combined b/ and cl/ links, it needs to use chrome as xdg-open doesn't recognise the app to open these
[[hints.enabled]]
regex = "(b/|cl/)\\d+"
command = "google-chrome"
binding = { key = "U", mods = "Control|Shift" }
mouse = { enabled = true, mods = "Shift" }

# 3. go/ links, it needs to use chrome as xdg-open doesn't recognise the app to open these
[[hints.enabled]]
regex = "(go/)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`]+"
command = "google-chrome"
binding = { key = "U", mods = "Control|Shift" }
mouse = { enabled = true, mods = "Shift" }
